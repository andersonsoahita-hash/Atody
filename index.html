<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A241A">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATODY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{padding:0}body{margin:0}</style>
<title>ATODY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: royal-blue sidebar with a yolk-yellow accent, Power-BI-style dashboard cards, Fraunces for numbers and titles. */
/* ATODY v6 : sobre, clair par défaut. Encre + jaune d'œuf adouci. Gloock (titres) + Outfit (texte). */
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--line:#E2E5EA;--fg:#1B1C21;--muted:#667082;
  --navy:#2A241A;--navy-d:#17130C;--navy2:#D9A21B;--navy-ink:#241A00;--yolk:#EDB72E;--yolk-ink:#2A1D00;
  --green:#14794F;--green-soft:#E1F3EA;--red:#B3261E;--red-soft:#FBE4E1;--amber:#8F5B00;--amber-soft:#FFF1CE;--blue-soft:#EEF1F6;
  --c1:#D9A21B;--c2:#14A07A;--c3:#E4742B;--c4:#4F7BD0;--c5:#D8493D;--c6:#D96C8E;--c7:#1BA9BD;--c8:#9A5F32;
  --shadow:0 1px 2px rgba(27,28,33,.05),0 8px 22px rgba(27,28,33,.06);
  --fd:'Gloock','Times New Roman',serif;--fb:'Outfit','Segoe UI',system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1013;--surface:#18191E;--line:#2A2C34;--fg:#F4F3EF;--muted:#9EA3B0;
  --green:#5FD6A0;--green-soft:#12291F;--red:#FF8374;--red-soft:#35191B;--amber:#F2B64F;--amber-soft:#33260F;--blue-soft:#20222A;
  --c1:#EDB72E;--c2:#4FD1A5;--c3:#FF8A3D;--c4:#8FB8FF;--c5:#FF6B5E;--c6:#FF9EB5;--c7:#7BE0E8;--c8:#C58A5B;
  --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1013;--surface:#18191E;--line:#2A2C34;--fg:#F4F3EF;--muted:#9EA3B0;
  --green:#5FD6A0;--green-soft:#12291F;--red:#FF8374;--red-soft:#35191B;--amber:#F2B64F;--amber-soft:#33260F;--blue-soft:#20222A;
  --c1:#EDB72E;--c2:#4FD1A5;--c3:#FF8A3D;--c4:#8FB8FF;--c5:#FF6B5E;--c6:#FF9EB5;--c7:#7BE0E8;--c8:#C58A5B;
  --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
svg{display:block}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),#0A1D33);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:#0F2A47;display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand b{font-family:var(--fd);font-size:20px;display:block;line-height:1.1;letter-spacing:.08em}
.brand i{font-style:normal;font-size:12px;opacity:.7}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:inherit;opacity:.78;padding:13px 12px;border-radius:12px;font-weight:600;text-align:left;min-height:48px}
.nav button.on{background:rgba(255,255,255,.14);opacity:1}
.nav svg{width:22px;height:22px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.65;padding:8px}
.main{padding:22px max(16px,env(safe-area-inset-right,0px)) 48px 30px;min-width:0}
.wrap{max-width:880px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:var(--fd);font-size:26px;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center;min-height:42px;box-shadow:var(--shadow)}
.chip svg{width:19px;height:19px}
.chip.ic{width:42px;padding:0;justify-content:center}
.chip .d{width:10px;height:10px;border-radius:50%;background:var(--green)}
.chip.off .d{background:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);max-width:100%}
.seg button{border:0;background:none;padding:9px 15px;font-weight:700;min-height:42px;white-space:nowrap}
.seg button.on{background:var(--navy2);color:#fff}
.banner{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-weight:700}
.banner button{border:1px solid var(--amber);background:none;color:inherit;border-radius:10px;padding:8px 12px;font-weight:700;min-height:40px}
.banner.blue{background:var(--blue-soft);color:var(--fg);border-color:var(--navy2)}
.big{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--green);color:#fff;border:0;border-radius:18px;padding:20px;font-family:var(--fd);font-size:20px;font-weight:700;min-height:68px;box-shadow:0 8px 20px rgba(30,123,79,.25);transition:transform .12s}
.big:active{transform:scale(.985)}
.big svg{width:26px;height:26px}
.big.navy{background:var(--navy2);box-shadow:none}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;min-height:52px;background:var(--navy2);color:#fff}
.btn.g{background:var(--green);color:#fff}
.btn.r{background:var(--red);color:#fff}
.btn.l{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.s{min-height:42px;padding:8px 14px;border-radius:11px;font-size:14px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;padding:6px 2px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.search{width:100%;margin:14px 0 4px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:52px}
h2{font-family:var(--fd);font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
h2 b{color:var(--fg);letter-spacing:0;text-transform:none;font-size:15px}
.list{display:flex;flex-direction:column;gap:8px}
.inv{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%;min-height:70px;box-shadow:var(--shadow)}
.inv .dot{width:10px;align-self:stretch;border-radius:6px}
.s-red .dot{background:var(--red)}.s-amber .dot{background:var(--amber)}.s-green .dot{background:var(--green)}.s-void .dot{background:var(--line)}
.mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.l1 b{overflow-wrap:anywhere}
.l1 em{font-style:normal;font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mid small{color:var(--muted)}
.pg{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px;max-width:240px}
.pg i{display:block;height:100%;background:var(--amber);border-radius:4px}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.amt small{display:block;font-weight:700;font-size:12px}
.s-red .amt small{color:var(--red)}.s-amber .amt small{color:var(--amber)}.s-green .amt small{color:var(--green)}.s-void .amt{color:var(--muted)}
.void .l1 b,.void .amt{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--fg);letter-spacing:.02em}
.tag.late{background:var(--red-soft);color:var(--red)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.void{background:var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-family:var(--fd);font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.sizes{display:grid;gap:8px}
.sz{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sz .n{font-family:var(--fd);font-size:20px;font-weight:700}
.sz .p{color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.step input{width:84px;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:44px;font-weight:700;font-variant-numeric:tabular-nums}
.totalbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy2);color:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;box-shadow:0 10px 24px rgba(15,42,71,.3)}
.totalbar b{font-family:var(--fd);font-size:22px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:52px;width:100%}
/* facture */
.paper{background:#fff;color:#13253A;border-radius:10px;box-shadow:0 2px 4px rgba(15,42,71,.1),0 18px 40px rgba(15,42,71,.12);overflow:hidden;position:relative;font-variant-numeric:tabular-nums}
.paper .band{background:linear-gradient(110deg,#0F2A47,#173E66);color:#fff;padding:26px 30px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.paper .band .co b{font-family:var(--fd);font-size:28px;letter-spacing:.12em;display:block;line-height:1}
.paper .band .co span{font-size:12px;opacity:.8;letter-spacing:.04em}
.paper .band .ti{text-align:right}
.paper .band .ti small{display:block;letter-spacing:.2em;font-size:11px;opacity:.75}
.paper .band .ti b{font-family:var(--fd);font-size:22px}
.paper .body{padding:26px 30px 8px}
.paper .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 18px;padding-bottom:20px;border-bottom:1px solid #DCE3EB}
.paper .meta small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6A7B8E;margin-bottom:3px;font-weight:700}
.paper .meta b{font-size:16px}
.paper .tw{overflow-x:auto;margin-top:6px}
.paper table{width:100%;border-collapse:collapse;min-width:420px}
.paper th{background:#EEF2F7;color:#33465B;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:right;padding:11px 12px}
.paper td{padding:12px;text-align:right;border-bottom:1px solid #E6ECF2;font-size:15px}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper tbody tr:nth-child(even) td{background:#FAFBFD}
.paper .tots{margin:18px 0 0 auto;width:min(340px,100%);display:grid;gap:8px}
.paper .tots div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.paper .tots .t{font-weight:800;font-size:17px;border-top:2px solid #0F2A47;padding-top:10px}
.paper .tots .r{background:#0F2A47;color:#fff;border-radius:10px;padding:13px 14px;font-family:var(--fd);font-size:18px;font-weight:700}
.paper .tots .r.z{background:#1E7B4F}
.paper .pays{margin-top:24px}
.paper .pays h4{margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6A7B8E}
.paper .py{display:grid;grid-template-columns:90px minmax(0,1fr) auto auto;gap:10px;padding:8px 0;border-bottom:1px dashed #D3DCE6;font-size:14px;align-items:center}
.paper .py.vd{text-decoration:line-through;color:#8A97A6}
.paper .py button{background:none;border:0;color:#6A7B8E;text-decoration:underline;font-weight:700;padding:4px}
.paper .foot{margin-top:24px;padding:16px 30px;background:#F5F7FA;color:#6A7B8E;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paper .wm{position:absolute;right:26px;top:128px;transform:rotate(-12deg);font-family:var(--fd);font-weight:700;font-size:40px;letter-spacing:.1em;border:5px solid;border-radius:14px;padding:2px 16px;opacity:.85;pointer-events:none;animation:pop .45s ease}
.paper .wm.g{color:#1E7B4F}.paper .wm.r{color:#C23A2E}.paper .wm.n{color:#8A97A6}
@keyframes pop{from{transform:rotate(-12deg) scale(1.5);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.85}}
@media (max-width:560px){.paper .band,.paper .body{padding-left:18px;padding-right:18px}.paper .foot{padding:14px 18px}.paper .wm{font-size:26px;top:150px}.paper .py{grid-template-columns:72px minmax(0,1fr) auto}.paper .py button{grid-column:1/-1;justify-self:end}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:block;width:100%;position:relative}
button.tile:hover{border-color:var(--navy2)}
.tile small{color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.tile small svg{width:16px;height:16px}
.tile b{display:block;font-family:var(--fd);font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
.chart svg text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.donut{grid-template-columns:1fr;justify-items:center}.donut .lg{width:100%}}
.lg div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--line)}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px}
.hb{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.hb .tr{height:12px;border-radius:7px;background:var(--line);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:7px;background:var(--navy2)}
.hb b{font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stk .n{font-family:var(--fd);font-weight:700;font-size:18px}
.stk .tr{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.stk .tr i{display:block;height:100%;background:var(--green);border-radius:8px}
.stk .tr.low i{background:var(--red)}
.stk .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stk .nums b{color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;padding:4px 0}
.cal button{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:66px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700}
.cal button.o{background:none;border:0}
.cal button.f{opacity:.4}
.cal button.td{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cal button.sel{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.cal .e{font-size:11px;color:var(--c3);font-weight:800}
.cal button.sel .e{color:#FFD9A0}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%}
.ev{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ev .ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.ev .ib svg{width:19px;height:19px}
.ev small{display:block;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 0;margin-bottom:6px;min-height:44px}
.tabs{display:none}
.modal{position:fixed;inset:0;background:rgba(8,18,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{background:var(--surface);width:min(540px,100%);border-radius:24px 24px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--fd);margin:0 0 14px;font-size:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;z-index:60;animation:fade .2s;max-width:90vw}
.view{animation:fade .25s}
.err{color:var(--red);font-weight:700;margin:-4px 0 10px}
.note{color:var(--muted);font-size:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow input[type=text],.setrow input:not([type]){width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right}
.dev{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev .di{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center}
.dev .di svg{width:22px;height:22px}
.dev small{display:block;color:var(--muted)}
.splash{position:fixed;inset:0;background:var(--navy);color:#fff;display:grid;place-items:center;z-index:100;animation:out .5s 1.3s forwards;text-align:center}
.splash b{font-family:var(--fd);font-size:42px;letter-spacing:.1em;display:block}
.splash i{font-style:normal;opacity:.8}
@keyframes out{to{opacity:0;visibility:hidden}}
.av{width:56px;height:56px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-size:22px;font-weight:700;flex:none}
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:40}

let _eggP=0,_eggInit=0;
function eggPaint(){const h=document.querySelector('.hegg');if(!h)return;const sp=Math.min(1,(window.scrollY||0)/420);h.style.setProperty('--p',Math.max(_eggP,sp*1).toFixed(3))}

 if(rm){_eggP=.45;eggPaint();return}
 const t0=performance.now(),run=now=>{const k=Math.min(1,(now-t0)/1900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;_eggP=.62*Math.sin(Math.PI*Math.min(1,k*1.0))*0+.48*e*(1-.0);eggPaint();if(k<1&&document.querySelector('.hegg'))requestAnimationFrame(run)};requestAnimationFrame(run)}
const _G='ABCDEFGHJKLMNPRSTUVXYZ0123456789#%+/<>';
function scr(el,txt){const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;if(rm){el.textContent=txt;return}

  if(o.zero){body+=`<defs><clipPath id="${o.id}a"><rect x="${L}" y="0" width="${W-L}" height="${y0}"/></clipPath><clipPath id="${o.id}b"><rect x="${L}" y="${y0}" width="${W-L}" height="${H-y0}"/></clipPath></defs>`;

  else{const base=H-B;body+=`<path class="fa" d="${p(o.series[0].vals)} L${x(n-1)} ${base} L${x(0)} ${base}Z" fill="${o.series[0].color}" fill-opacity=".14"/>`;o.series.forEach(s=>body+=`<path d="${p(s.vals)}" class="dw" pathLength="1" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linejoin="round"/>`)}

const swInit=()=>({start:TODAY,cash:'',hens:'',stock:{},prices:{...REAL.prices},clients:[{n:'',tel:'',debt:''}],fixed:[],staff:[]});

const swI=(path,val,ph,mode)=>`<input data-sw="${path}" value="${esc(val==null?'':val)}" placeholder="${ph||''}" ${mode==='n'?'inputmode="numeric"':mode==='t'?'inputmode="tel"':''} autocomplete="off">`;

function vSetup(){const w=sw||(sw=swInit());
 if(REAL.setup)return `<div class="card"><h3>Situation de départ déjà enregistrée</h3><p class="note">Elle ne se refait pas : chaque élément se corrige ensuite à son endroit (clients, prix, dépenses…).</p></div>`;
 const sec=(a,b,body)=>`<div class="card swc"><h3>${a}</h3><p class="note">${b}</p>${body}</div>`;
 const sizes=(root,vals)=>`<div class="swg">${SIZES.map(k=>`<div class="field"><label>${szb(k)}</label>${swI(root+'.'+k,vals[k],'0','n')}</div>`).join('')}</div>`;
 return `<p class="note" style="margin:0 2px 12px">À faire une seule fois, le premier jour. Ce qui reste vide vaut zéro, et tout se corrige ensuite.</p>`+
 sec('1. Début du suivi','Le jour à partir duquel tout est enregistré dans ATODY. Avant cette date, rien n’est jugé.',`<div class="field"><label for="sw-start">Date de départ</label><input id="sw-start" type="date" data-sw="start" value="${w.start}" max="${TODAY}"></div>`)+
 sec('2. Caisse de départ (facultatif)','Laisse vide si tu ne sais pas : le suivi part alors de zéro et ne compte que les encaissements et les dépenses à partir de ce jour. Si tu la remplis, mets seulement l’argent réservé à la ferme.',`<div class="field"><label for="sw-cash">Montant en Ar</label>${swI('cash',w.cash,'ex. 500000','n').replace('data-sw=','id="sw-cash" data-sw=')}</div>`)+
 sec('3. Poules','Le nombre de poules pondeuses aujourd’hui.',`<div class="field"><label for="sw-hens">Nombre de poules</label>${swI('hens',w.hens,'ex. 900','n').replace('data-sw=','id="sw-hens" data-sw=')}</div>`)+
 sec('4. Stock d’œufs','Les œufs déjà ramassés et pas encore vendus, par taille.',sizes('stock',w.stock))+
 sec('5. Prix de vente','Le prix de l’œuf par taille, en Ar. Un changement plus tard ne touche jamais les anciennes factures.',sizes('prices',w.prices))+
 sec('6. Revendeurs et ce qu’ils doivent','Reprends la dernière colonne du carnet. Ce qu’un revendeur doit encore devient un « ancien solde » à encaisser.',w.clients.map((r,k)=>`<div class="swr"><div class="field"><label>Nom</label>${swI('clients.'+k+'.n',r.n,'ex. Mickaïa')}</div><div class="field"><label>Téléphone</label>${swI('clients.'+k+'.tel',r.tel,'034…','t')}</div><div class="field"><label>Doit encore (Ar)</label>${swI('clients.'+k+'.debt',r.debt,'0','n')}</div><button class="link" data-a="swdel" data-k="clients" data-i="${k}">Retirer</button></div>`).join('')+`<button class="btn l s" data-a="swadd" data-k="clients">+ Ajouter un revendeur</button>`)+
 sec('7. Dépenses fixes','Ce qui revient à date régulière (eau, électricité, transport…). Elles s’ajoutent toutes seules, et le montant se modifie quand le prix change.',w.fixed.map((r,k)=>`<div class="swr"><div class="field"><label>Nom</label>${swI('fixed.'+k+'.n',r.n,'ex. Eau')}</div><div class="field"><label>Catégorie</label><select data-sw="fixed.${k}.cat">${catOpts(r.cat)}</select></div><div class="field"><label>Montant (Ar)</label>${swI('fixed.'+k+'.a',r.a,'0','n')}</div><div class="field"><label>Rythme</label><select data-sw="fixed.${k}.every"><option value="month" ${r.every==='month'?'selected':''}>Chaque mois</option><option value="week" ${r.every==='week'?'selected':''}>Chaque semaine</option></select></div><div class="field"><label>Jour</label><select data-sw="fixed.${k}.day">${dayOpts(r.every,r.day)}</select></div><button class="link" data-a="swdel" data-k="fixed" data-i="${k}">Retirer</button></div>`).join('')+`<button class="btn l s" data-a="swadd" data-k="fixed">+ Ajouter une dépense fixe</button>`)+
 sec('8. Salaires','Une ligne par personne. Le salaire s’ajoute tout seul aux dépenses chaque mois.',w.staff.map((r,k)=>`<div class="swr"><div class="field"><label>Nom</label>${swI('staff.'+k+'.n',r.n,'ex. Rakoto')}</div><div class="field"><label>Salaire par mois (Ar)</label>${swI('staff.'+k+'.a',r.a,'0','n')}</div><div class="field"><label>Jour de paie</label><select data-sw="staff.${k}.day">${dayOpts('month',r.day)}</select></div><button class="link" data-a="swdel" data-k="staff" data-i="${k}">Retirer</button></div>`).join('')+`<button class="btn l s" data-a="swadd" data-k="staff">+ Ajouter une personne</button>`)+
 `<div class="err" id="swer"></div><button class="big gr" data-a="swsave" style="margin-top:6px">Enregistrer la situation de départ</button>`}
function swSave(){const w=sw,er=document.getElementById('swer');
 if(!w.start||w.start>TODAY){er.textContent='Choisis une date de départ (pas dans le futur).';return}
 const bad=w.fixed.find(f=>f.n.trim()&&f.a<=0)||w.staff.find(f=>f.n.trim()&&f.a<=0);if(bad){er.textContent='Indique un montant pour « '+bad.n+' ».';return}
 const nc=w.fixed.find(f=>f.n.trim()&&f.a>0&&!f.cat);if(nc){er.textContent='Choisis une catégorie pour « '+nc.n+' ».';return}
 REAL.start=w.start;REAL.cash0=w.cash||0;REAL.prices={...w.prices};
 if(w.hens>0)REAL.hens.push({id:uid(),d:w.start,n:w.hens,kind:'init',note:'Effectif de départ'});
 const q={};SIZES.forEach(k=>{if(w.stock[k]>0)q[k]=w.stock[k]});if(Object.keys(q).length)REAL.ram.push({id:uid(),d:w.start,q,note:'Stock de départ'});
 w.clients.filter(r=>r.n.trim()).forEach(r=>{const id=uid();REAL.clients.push({id,n:r.n.trim(),tel:r.tel||''});if(r.debt>0)REAL.inv.push({id:uid(),no:-1,tmp:Date.now(),cl:id,d:addD(w.start,-1),q:{},pu:{},pays:[],amt:r.debt,open:true})});
 w.fixed.filter(r=>r.n.trim()&&r.a>0).forEach(r=>REAL.fixed.push({id:uid(),kind:'charge',n:r.n.trim(),cat:r.cat,every:r.every,day:r.every==='week'?r.day:(r.day||1),from:w.start,hist:[{from:w.start,a:r.a}],on:true}));
 w.staff.filter(r=>r.n.trim()&&r.a>0).forEach(r=>REAL.fixed.push({id:uid(),kind:'salary',n:r.n.trim(),cat:'Employés',every:'month',day:r.day||5,from:w.start,hist:[{from:w.start,a:r.a}],on:true}));
 (REAL.log=REAL.log||[]).push({id:uid(),d:TODAY,t:'Situation de départ enregistrée : début '+dfmt(REAL.start)+', caisse '+ar(REAL.cash0||0)+', '+REAL.clients.length+' client(s)',why:'Première configuration',by:meName()});
 REAL.setup=true;sw=null;applyFixed();stack=[];view='home';sub=null;toast('Situation de départ enregistrée');render()}

 <h2>Personnes qui encaissent</h2><div class="card"><div class="row" style="gap:8px">${c.people.map(x=>`<span class="chip" style="box-shadow:none">${esc(x)}<button class="link" data-a="delPer" data-n="${esc(x)}" style="min-height:24px;padding:0 2px" aria-label="Retirer ${esc(x)}">✕</button></span>`).join('')}</div>
 <div class="row" style="margin-top:12px"><input id="nper" placeholder="Nom de la personne" style="padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:48px"><button class="btn s" data-a="addPer" style="flex:0 0 auto">Ajouter</button></div>
 <p class="note">Elles apparaissent dans « Encaissé par » lors d’un encaissement.</p></div>

function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const v=parseFloat(el.dataset.count),f=el.dataset.f,t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/800),e=1-Math.pow(1-k,3);el.textContent=fmtv(v*e,f);if(k<1)requestAnimationFrame(step);else el.textContent=fmtv(v,f)};requestAnimationFrame(step)})}
function render(){
 applyFixed();let b;
 if(view==='setup')b=vSetup();else if(view==='inv'&&sub)b=vInv();else if(view==='new')b=vNew();else if(view==='preview')b=vPreview();else if(view==='enc')b=vEnc();else if(view==='due')b=vDue();
 else b={home:vHome,stock:vStock,exp:vExp,cli:vCli,bil:vBil,set:vSet,start:vStart}[view]();

 document.getElementById('root').innerHTML=shell(b);
 if(fresh&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))countUp();fresh=false;

/* ---------- fenêtres ---------- */
function modal(h){document.getElementById('layer').innerHTML=`<div class="modal" data-a="mclose"><div class="sheet">${h}</div></div>`}
function close(){document.getElementById('layer').innerHTML=''}
const sizeFields=()=>`<div class="sizes">${SIZES.map(s=>`<div class="sz" style="grid-template-columns:70px 1fr">${szb(s)}<input inputmode="numeric" data-col="${s}" placeholder="0" style="padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:44px;text-align:right" aria-label="${s}"></div>`).join('')}</div>`;
const dateField=(id,d)=>`<div class="field"><label for="${id}">Date</label><input type="date" id="${id}" value="${d||TODAY}" max="${TODAY}"></div>`;
const noteField=(id,ph)=>`<div class="field"><label for="${id}">Note (facultatif)</label><input id="${id}" placeholder="${ph||''}"></div>`;
const btns=(a,extra)=>`<div class="row"><button class="btn l" data-a="mclose">${t('cancel')}</button><button class="btn g" data-a="${a}" ${extra||''}>${t('save')}</button></div>`;
let payCl='',payAmt=0;
let payMode='new';
const cdM=(id,m)=>liveInv().filter(i=>i.cl===id&&(m==='all'||(m==='old')===(i.amt!=null))).reduce((q,i)=>q+Math.max(0,rest(i)),0);
const hasOld=()=>liveInv().some(i=>i.amt!=null&&rest(i)>0);
function allocPlan(cl,amt){const invs=liveInv().filter(i=>i.cl===cl&&rest(i)>0&&(payMode==='all'||(payMode==='old')===(i.amt!=null))).sort((x,y)=>x.d.localeCompare(y.d)),plan=[];let left=amt;invs.forEach(i=>{const p=Math.min(left,rest(i));if(p>0){plan.push({i,p,full:p===rest(i)});left-=p}});return {plan,left,debt:invs.reduce((a,i)=>a+rest(i),0),n:invs.length}}
function payPrev(){if(!payCl)return '<p class="note">Choisis d’abord le revendeur.</p>';const A=allocPlan(payCl,payAmt);
 if(!A.debt)return `<p class="note">${esc(cname(payCl))} ne doit rien.</p>`;
 if(!payAmt)return `<p class="note">${esc(cname(payCl))} doit <b>${ar(A.debt)}</b> sur ${A.n} facture${A.n>1?'s':''}. Entre le montant reçu : il sera réparti tout seul, de la plus ancienne facture à la plus récente.</p>`;

const SYK='atody_sync';
const DEFAULT_SERVER='https://script.google.com/macros/s/AKfycbw1wFY3GnxcDM5klOUvIHaI029YVvhZG7ftlM4qBcTvorKM88b7vKTSvGY4B2yif5U/exec';
const SYERR={code_manquant:'Entre ton code d’accès.',code_inconnu:'Ce code n’existe pas. Vérifie les lettres et les tirets.',code_deja_utilise:'Ce code est déjà utilisé sur un autre appareil. Demande un nouveau code à Stephen.',code_desactive:'Ce code a été désactivé.',non_active:'Cet appareil n’est pas encore activé : entre le code et appuie sur « Activer cet appareil ».',appareil_inconnu:'Appareil non reconnu.',serveur_non_prepare:'Le serveur n’est pas encore prêt (l’onglet Codes manque).'};
const syncCfg=()=>{try{return JSON.parse(localStorage.getItem(SYK))||{}}catch(e){return{}}};
const syncSet=o=>{try{localStorage.setItem(SYK,JSON.stringify({...syncCfg(),...o}))}catch(e){}};
async function syncCall(body){const c=syncCfg();if(!c.url||!c.token)throw new Error('Adresse ou code manquant');
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
 try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:c.token,device:{id:c.dev,nom:c.name||''}}),redirect:'follow',signal:ctl.signal});
  const j=await r.json();if(!j.ok)throw new Error(SYERR[j.erreur]||j.erreur||'Erreur du serveur');return j}finally{clearTimeout(tm)}}
let lastSent='',syncBusy=false;
async function syncBackup(force){if(training||syncBusy)return false;const c=syncCfg();if(!c.url||!c.token||!REAL.setup)return false;
 const js=JSON.stringify(REAL);if(!force&&js===lastSent)return false;syncBusy=true;
 try{await syncCall({action:'backup',json:js});lastSent=js;syncSet({ok:Date.now(),err:''});return true}
 catch(e){syncSet({err:String(e.message||e)});return false}
 finally{syncBusy=false;const ae=document.activeElement;if(view==='set'&&!document.querySelector('.modal')&&!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()}}
setInterval(()=>{if(navigator.onLine!==false)syncBackup(false)},180000);
window.addEventListener('online',()=>syncBackup(false));

 return `<div class="card"><h3>Connexion au serveur</h3><p class="note" style="margin:4px 0 10px">Une copie complète des données part toute seule vers le Google Sheet, toutes les 3 minutes quand il y a du nouveau et que le téléphone ou l’ordinateur a internet. ${st}</p>

  close();toast('Annulé. Le détail reste visible.');render();return}
 case 'setTheme2':return;

 case 'delCat':c.cats=c.cats.filter(x=>x!==b.dataset.n);render();return;

 case 'devOk':c.devices.find(d=>d.id===b.dataset.id).ok=true;toast('Appareil autorisé');render();return;
 case 'devDel':c.devices=c.devices.filter(d=>d.id!==b.dataset.id);toast('Appareil retiré');render();return;

 }

 {const m={hfd1:'from',hfd2:'to',hfcl:'cl',hfmin:'min',hfmax:'max'}[e.target.id];if(m){hf[m]=e.target.value;render();return}const m2={efd1:'from',efd2:'to',efcat:'cat'}[e.target.id];if(m2){ef[m2]=e.target.value;render();return}}

/* ----- écran d'ouverture : revient après 5 minutes d'inactivité ----- */
let lastAct=Date.now(),splashOn=false;
function armSplash(first){const sp=document.getElementById('splash');if(!sp)return;splashOn=true;let done=false;
 const w=sp.querySelector('#spw');if(w){w.textContent='';setTimeout(()=>scr(w,'ATODY'),700)}
 const kd=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();leave()}};
 const leave=()=>{if(done)return;done=true;document.removeEventListener('keydown',kd);sp.classList.add('leave');setTimeout(()=>{sp.remove();splashOn=false;lastAct=Date.now();first?authGate():root('home')},800)};
 document.addEventListener('keydown',kd);sp.addEventListener('click',leave);const bt=sp.querySelector('#spgo');bt&&bt.focus({preventScroll:true})}
function showSplash(){if(splashOn||!SPLASH_HTML)return;close();document.body.insertAdjacentHTML('beforeend',SPLASH_HTML);armSplash(false)}
['pointerdown','keydown','touchstart','wheel','mousemove'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{const idle=Date.now()-lastAct;if(todayStr()!==TODAY&&idle>30000){location.reload();return}if(!splashOn&&me&&idle>300000)showSplash()},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&todayStr()!==TODAY)location.reload();if(document.visibilityState==='hidden')persist()});
window.addEventListener('pagehide',persist);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
armSplash(true);
render();
